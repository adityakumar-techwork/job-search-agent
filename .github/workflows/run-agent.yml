name: Daily Agent Run

on:
  schedule:
    - cron: '30 2 * * *' # 08:00 IST (UTC+5:30) daily
  workflow_dispatch:

permissions:
  contents: read

# Never let two runs overlap (a manual dispatch during the scheduled run would double-spend quota).
concurrency:
  group: agent-run
  cancel-in-progress: false

jobs:
  run-agent:
    name: Run agent loop
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
      # base64 of your resume PDF: `base64 -i resume.pdf | pbcopy` (macOS) / `base64 -w0 resume.pdf` (Linux)
      RESUME_BASE64: ${{ secrets.RESUME_BASE64 }}
      USER_CONTEXT: ${{ vars.USER_CONTEXT }}
      JOB_TITLES: ${{ vars.JOB_TITLES }}
      YEARS_EXPERIENCE: ${{ vars.YEARS_EXPERIENCE }}
      PREFERRED_TECHNICAL_STACK: ${{ vars.PREFERRED_TECHNICAL_STACK }}
      LOCATION_PRIORITY: ${{ vars.LOCATION_PRIORITY }}
      EXCLUDE_KEYWORDS: ${{ vars.EXCLUDE_KEYWORDS }}

    steps:
      - name: Check required secrets
        run: |
          missing=""
          for v in DATABASE_URL LLM_API_KEY RESUME_BASE64; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Apply database schema
        run: npm run db:migrate

      - name: Run agent
        run: npm run agent
